<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllSeattle — Seattle News, Business Directory & Auto Classifieds</title>
<meta name="description" content="AllSeattle — the Seattle city portal for news, businesses, events and cars. If you're not on this website, you don't exist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 80%22><path d=%22M32 2C15.98 2 4 14.4 4 30.2 4 50.4 32 78 32 78s28-27.6 28-47.8C60 14.4 48.02 2 32 2z%22 fill=%22%23E53935%22/></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/home.css">
</head>
<body data-page-type="home" data-page="home">

<div id="site-header"></div>

<main>
  <section class="section-tight">
    <div class="container home-layout">
      <aside class="home-sidebar home-sidebar-left">
        <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="home-left-1"></div>
        <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="home-left-2"></div>
        <div class="ad-desktop-slot" data-ad-slot="300x600" data-ad-slot-mobile="320x100" data-ad-seed="home-left-3"></div>
        <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="home-left-4"></div>
      </aside>

      <div class="home-main">
        <div class="ad-slot-top" data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="home-top"></div>
        <div class="section-head">
          <div>
            <span class="eyebrow">Today in Seattle</span>
            <h1>Top News</h1>
          </div>
          <a href="news.html" class="btn btn-outline btn-sm">All News</a>
        </div>
        <div class="grid news-grid" id="home-news-grid"></div>
      </div>

      <aside class="home-sidebar home-sidebar-right">
        <div class="widget" id="widget-trending">
          <h4>Trending Now</h4>
        </div>
        <div class="widget" id="widget-stats">
          <h4>AllSeattle by the numbers</h4>
        </div>
        <div class="widget" id="widget-currency">
          <h4>Exchange rates</h4>
        </div>
        <div class="widget" id="widget-jobs">
          <h4>Job search</h4>
        </div>
        <div class="widget" id="widget-transit">
          <h4>Transit status</h4>
        </div>
        <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="home-right-1"></div>
        <div class="mobile-footer-ads" id="mobile-footer-ads"></div>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/home.js"></script>
</body>
</html>
